name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: python -m pip install requests

      - name: Build the mod
        run: chmod +x ./build.sh && ./build.sh

      - name: Verify mod exists
        run: |
          test -d mod
          ls -la mod

      - name: Create archive
        run: zip -r ${{ github.event.repository.name }}-${{ github.ref_name }}.zip mod/

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: mod.zip
