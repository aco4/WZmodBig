name: CI Build

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: python -m pip install requests

      - name: Build the mod
        run: ./build.sh

      - name: Verify mod exists
        run: |
          test -d mod
          ls -la mod

      - name: Create archive
        run: |
          ARCHIVE_NAME="${{ github.event.repository.name }}-${{ github.sha }}.zip"
          cd mod
          zip -r "../$ARCHIVE_NAME" .
          cd ..
          echo "ARCHIVE_NAME=$ARCHIVE_NAME" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: ${{ env.ARCHIVE }}
